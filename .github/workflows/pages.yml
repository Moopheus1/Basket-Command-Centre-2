name: Deploy Pages

on:
  workflow_dispatch: {}   # dispatched programmatically by update-data.yml after a real data change
  push:
    branches: ["main"]
    paths:
      - "docs/**"
    # Note: pushes made by update-data.yml use GITHUB_TOKEN, which does NOT
    # trigger this `push` event (GitHub's anti-recursion rule). This trigger
    # exists as a no-cost fallback for commits made under a real user account
    # (e.g. editing index.html directly in GitHub's web UI) - those DO carry
    # a real identity, not the bot's, and will fire normally.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
