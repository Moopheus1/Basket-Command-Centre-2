name: Update market data

on:
  schedule:
    # --- Intraday: premarket 8:00am ET (1.5h before open) through 1:30pm ET
    # (4h after open), every 10 min, one continuous block (34 runs/day) ---
    - cron: "0,10,20,30,40,50 8,9,10,11,12 * * 1-5"
      timezone: "America/New_York"
    - cron: "0,10,20,30 13 * * 1-5"
      timezone: "America/New_York"
    # --- EOD: single run at 4:30pm ET, after close settles ---
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode for externally-dispatched runs (the Cloudflare dispatcher passes this explicitly, since github.event.schedule is always empty on workflow_dispatch)"
        required: false
        default: "eod"
        type: choice
        options:
          - eod
          - intraday
  push:
    paths:
      - "tickers.txt"

permissions:
  contents: write
  actions: write   # needed to dispatch pages.yml after a successful data commit

concurrency:
  group: update-market-data
  cancel-in-progress: false   # if a run is still going when the next trigger fires, the
                              # new one waits instead of racing it to git push. Only one
                              # run can be pending at a time (GitHub default) - if a third
                              # trigger fires before the first two finish, the older pending
                              # run is dropped and replaced by the newest. That's fine here:
                              # skipping a stale 10-min-old fetch to catch up to "now" is the
                              # right behavior, not a bug.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # kill hung runs well before the next 10-min trigger fires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Determine fetch mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            # Externally dispatched (Cloudflare cron dispatcher, or a manual
            # UI run) - trust the explicit input rather than guessing from
            # github.event.schedule, which is always empty on workflow_dispatch.
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 16 * * 1-5" ]; then
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ github.event.schedule }}" ]; then
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          else
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch market data
        env:
          FETCH_MODE: ${{ steps.mode.outputs.mode }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/fetch_data.py
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # docs/data.json and docs/alert_state.json are written with no
          # indentation (single-line JSON) - fast, but it means two runs
          # touching the same file produce a real content conflict on that
          # one line, which git cannot auto-merge no matter how many times
          # a pull-rebase is retried (confirmed: retrying an unresolved
          # rebase just repeats the identical failure, since the conflict
          # from attempt 1 is never cleaned up before attempt 2).
          #
          # The correct fix is to never attempt a merge on these two paths
          # at all: they are 100% machine-regenerated every run, so there
          # is no legitimate "partial old + partial new" version worth
          # preserving - whichever run finishes last should simply win
          # outright. Each retry resets to the latest remote tip and
          # re-applies OUR already-computed files on top, which is always
          # a clean fast-forward, never a content merge.
          # Save the freshly-fetched output BEFORE any git manipulation.
          # git reset --hard overwrites tracked files' working-tree content
          # back to whatever origin has - confirmed directly, not assumed:
          # a reset silently discards uncommitted fresh content and leaves
          # the stale committed version in place. Each retry below must
          # restore the fresh copy after every reset, not just once, or a
          # retry would succeed while quietly throwing away real data.
          cp docs/data.json /tmp/fresh_data.json
          cp docs/alert_state.json /tmp/fresh_alert_state.json

          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/fresh_data.json docs/data.json
            cp /tmp/fresh_alert_state.json docs/alert_state.json
            git add docs/data.json docs/alert_state.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              pushed=true
              break
            fi
            git commit -q -m "Update market data [skip ci]"
            if git push -q; then
              pushed=true
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push attempt $i failed (remote moved again), retrying..."
            sleep 3
          done
          if [ "$pushed" = false ]; then
            echo "::error::Failed to push after 5 attempts - remote kept moving faster than 5 retries could catch up"
            exit 1
          fi
      - name: Trigger Pages deploy
        # GITHUB_TOKEN-authenticated pushes don't fire other workflows' `push`
        # triggers (GitHub's anti-recursion rule) - workflow_dispatch is exempt
        # from that rule, so we dispatch pages.yml explicitly instead of relying
        # on it noticing the push. Only fires when data.json actually changed,
        # not on every 10-min tick that found nothing new.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
